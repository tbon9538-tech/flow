name: Build PolaFlow Global Hacker EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    # --- 修复点 1: FFmpeg 改用 GitHub BtbN 源 (永久有效 + 完整滤镜) ---
    - name: Download FFmpeg (BtbN Full Version)
      shell: pwsh
      run: |
        Write-Host "Downloading FFmpeg from BtbN (GitHub)..."
        # 使用 Master Latest GPL Shared 版本 (包含 chromaberrap 等所有滤镜)
        $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
        Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip"
        
        Write-Host "Extracting FFmpeg..."
        Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp
        
        # 智能查找：递归寻找 ffmpeg.exe，不管解压后文件夹叫什么
        $ffmpegPath = Get-ChildItem -Path ffmpeg_temp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        
        if ($ffmpegPath) {
            Write-Host "Found FFmpeg at: $($ffmpegPath.FullName)"
            Move-Item $ffmpegPath.FullName .
            Write-Host "FFmpeg Full Version ready."
        } else {
            Write-Error "FFmpeg executable not found in the zip!"
            exit 1
        }

    # --- 修复点 2: ExifTool 改为自动抓取最新版 (永不 404) ---
    - name: Download ExifTool (Auto-Scrape Latest)
      shell: pwsh
      run: |
        Write-Host "Detecting latest ExifTool version..."
        # 访问官网首页，自动提取最新 zip 文件名
        $web = Invoke-WebRequest "https://exiftool.org/" -UseBasicParsing
        $link = $web.Links | Where-Object { $_.href -match "^exiftool-\d+\.\d+\.zip$" } | Select-Object -First 1
        
        if (-not $link) {
            Write-Error "Could not detect ExifTool version from website!"
            exit 1
        }
        
        $downloadUrl = "https://exiftool.org/" + $link.href
        Write-Host "Downloading latest version: $($link.href)"
        
        Invoke-WebRequest -Uri $downloadUrl -OutFile "exiftool.zip"
        
        Write-Host "Extracting ExifTool..."
        Expand-Archive exiftool.zip -DestinationPath exiftool_temp
        
        # 查找并重命名 (-k) 版本
        $exiftoolOriginal = Get-ChildItem -Path exiftool_temp -Recurse -Filter "exiftool(-k).exe" | Select-Object -First 1
        
        if ($exiftoolOriginal) {
            Move-Item $exiftoolOriginal.FullName -Destination ".\exiftool.exe"
            Write-Host "ExifTool ready."
        } else {
            Write-Error "ExifTool executable not found!"
            exit 1
        }

    # 打包流程
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --clean --onefile --console --name "PolaFlow_Global_Hacker_v24" --add-data "ffmpeg.exe;." --add-data "exiftool.exe;." main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PolaFlow_Tool_v24
        path: dist/PolaFlow_Global_Hacker_v24.exe
