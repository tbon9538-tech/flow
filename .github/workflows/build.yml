name: Build PolaFlow Global Hacker EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    # --- 修复点 1: 下载 FFmpeg "Full" 完整版 (包含 chromaberrap 滤镜) ---
    - name: Download FFmpeg (Full Version)
      shell: pwsh
      run: |
        Write-Host "Downloading FFmpeg FULL build..."
        # 注意：这里改成了 -full.zip，之前是 -essentials.zip
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.zip" -OutFile "ffmpeg.zip"
        
        Write-Host "Extracting FFmpeg..."
        Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp
        
        # 智能查找完整版 ffmpeg.exe
        $ffmpegPath = Get-ChildItem -Path ffmpeg_temp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        if ($ffmpegPath) {
            Move-Item $ffmpegPath.FullName .
            Write-Host "FFmpeg Full Version ready."
        } else {
            Write-Error "FFmpeg executable not found!"
            exit 1
        }

    # --- 修复点 2: 下载 ExifTool 最新版 (修复 404 错误) ---
    - name: Download ExifTool
      shell: pwsh
      run: |
        Write-Host "Downloading ExifTool v13.xx..."
        # 使用官方最新的 64位版本链接 (长期有效)
        Invoke-WebRequest -Uri "https://exiftool.org/exiftool-13.20_64.zip" -OutFile "exiftool.zip"
        
        Write-Host "Extracting ExifTool..."
        Expand-Archive exiftool.zip -DestinationPath exiftool_temp
        
        # 智能查找并重命名
        $exiftoolOriginal = Get-ChildItem -Path exiftool_temp -Recurse -Filter "exiftool(-k).exe" | Select-Object -First 1
        if ($exiftoolOriginal) {
            Move-Item $exiftoolOriginal.FullName -Destination ".\exiftool.exe"
            Write-Host "ExifTool ready."
        } else {
            Write-Error "ExifTool not found in zip!"
            exit 1
        }

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --clean --onefile --console --name "PolaFlow_Global_Hacker_v24" --add-data "ffmpeg.exe;." --add-data "exiftool.exe;." main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PolaFlow_Tool_v24
        path: dist/PolaFlow_Global_Hacker_v24.exe
