name: Build PolaFlow Global Hacker EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    # 1. FFmpeg (BtbN 完整版) - 保持这个，它是成功的关键！
    - name: Download FFmpeg (BtbN Full Version)
      shell: pwsh
      run: |
        Write-Host "Downloading FFmpeg from BtbN (GitHub)..."
        $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
        Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip"
        
        Write-Host "Extracting FFmpeg..."
        Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp
        
        $ffmpegPath = Get-ChildItem -Path ffmpeg_temp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        
        if ($ffmpegPath) {
            Write-Host "Found FFmpeg at: $($ffmpegPath.FullName)"
            Move-Item $ffmpegPath.FullName .
            Write-Host "FFmpeg Full Version ready."
        } else {
            Write-Error "FFmpeg executable not found in the zip!"
            exit 1
        }

    # 2. ExifTool (Chocolatey + 智能模糊查找) - 修复找不到文件的问题
    - name: Install ExifTool via Chocolatey
      shell: pwsh
      run: |
        Write-Host "Installing ExifTool using Chocolatey..."
        # 强制安装，忽略校验和警告
        choco install exiftool -y --no-progress --force --ignore-checksums
        
        Write-Host "Searching for executable in Chocolatey lib..."
        $chocoLib = "C:\ProgramData\chocolatey\lib"
        
        # 关键修复：搜索 'exiftool*.exe' (包含 exiftool.exe 和 exiftool(-k).exe)
        # 并按文件大小降序排列，确保取到的是主程序(大文件)而不是垫片(小文件)
        $exiftoolBinary = Get-ChildItem -Path $chocoLib -Recurse -Filter "exiftool*.exe" | Sort-Object Length -Descending | Select-Object -First 1
        
        if ($exiftoolBinary) {
            Write-Host "Found binary at: $($exiftoolBinary.FullName)"
            # 复制并统一重命名为 exiftool.exe
            Copy-Item $exiftoolBinary.FullName -Destination ".\exiftool.exe"
            Write-Host "ExifTool ready."
        } else {
            Write-Error "Could not locate any exiftool binary in $chocoLib. Listing directory for debug:"
            Get-ChildItem -Path $chocoLib -Recurse | Select-Object FullName
            exit 1
        }

    # 3. 打包 EXE
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --clean --onefile --console --name "PolaFlow_Global_Hacker_v24" --add-data "ffmpeg.exe;." --add-data "exiftool.exe;." main.py

    # 4. 上传
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PolaFlow_Tool_v24
        path: dist/PolaFlow_Global_Hacker_v24.exe
