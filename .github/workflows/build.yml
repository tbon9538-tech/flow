name: Build PolaFlow Global Hacker EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    # --- 修复点 1: 更换为 GitHub 官方托管的 BtbN FFmpeg (GPL 完整版) ---
    # 解决了 gyan.dev 的反爬虫拦截问题，且包含 chromaberrap 所有滤镜
    - name: Download FFmpeg (BtbN Full Version)
      shell: pwsh
      run: |
        Write-Host "Downloading FFmpeg from BtbN (GitHub Releases)..."
        # 使用 Master Latest GPL Shared 版本 (包含所有滤镜)
        $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
        Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip"
        
        Write-Host "Extracting FFmpeg..."
        Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp
        
        # 智能查找：BtbN 的 exe 通常在 bin 文件夹里，使用递归查找确保找到
        $ffmpegPath = Get-ChildItem -Path ffmpeg_temp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        
        if ($ffmpegPath) {
            Write-Host "Found FFmpeg at: $($ffmpegPath.FullName)"
            Move-Item $ffmpegPath.FullName .
            Write-Host "FFmpeg Full Version ready."
        } else {
            Write-Error "FFmpeg executable not found in the zip!"
            exit 1
        }

    # --- 修复点 2: ExifTool 保持最新逻辑 ---
    - name: Download ExifTool
      shell: pwsh
      run: |
        Write-Host "Downloading ExifTool v13.xx..."
        # 使用官方最新的 64位版本链接
        Invoke-WebRequest -Uri "https://exiftool.org/exiftool-13.20_64.zip" -OutFile "exiftool.zip"
        
        Write-Host "Extracting ExifTool..."
        Expand-Archive exiftool.zip -DestinationPath exiftool_temp
        
        # 智能查找 (-k) 版本并重命名
        $exiftoolOriginal = Get-ChildItem -Path exiftool_temp -Recurse -Filter "exiftool(-k).exe" | Select-Object -First 1
        
        if ($exiftoolOriginal) {
            Write-Host "Found ExifTool at: $($exiftoolOriginal.FullName)"
            Move-Item $exiftoolOriginal.FullName -Destination ".\exiftool.exe"
            Write-Host "ExifTool ready."
        } else {
            Write-Error "ExifTool not found in zip!"
            exit 1
        }

    # 打包流程
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --clean --onefile --console --name "PolaFlow_Global_Hacker_v24" --add-data "ffmpeg.exe;." --add-data "exiftool.exe;." main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PolaFlow_Tool_v24
        path: dist/PolaFlow_Global_Hacker_v24.exe
