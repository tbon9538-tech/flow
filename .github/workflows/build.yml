name: Build PolaFlow Global Hacker EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    # 1. FFmpeg (BtbN 完整版) - 保持这个，它已经成功了！
    - name: Download FFmpeg (BtbN Full Version)
      shell: pwsh
      run: |
        Write-Host "Downloading FFmpeg from BtbN (GitHub)..."
        $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
        Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip"
        
        Write-Host "Extracting FFmpeg..."
        Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp
        
        $ffmpegPath = Get-ChildItem -Path ffmpeg_temp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        
        if ($ffmpegPath) {
            Write-Host "Found FFmpeg at: $($ffmpegPath.FullName)"
            Move-Item $ffmpegPath.FullName .
            Write-Host "FFmpeg Full Version ready."
        } else {
            Write-Error "FFmpeg executable not found in the zip!"
            exit 1
        }

    # 2. ExifTool (改为 Chocolatey 安装) - 彻底解决超时/404问题
    - name: Install ExifTool via Chocolatey
      shell: pwsh
      run: |
        Write-Host "Installing ExifTool using Chocolatey (More Stable)..."
        # 使用包管理器安装，不再依赖不稳定的官网直链
        choco install exiftool -y --no-progress
        
        # 查找安装后的真实 exe 文件 (Choco 通常安装在 lib 目录下)
        # 我们递归查找 exiftool(-k).exe，确保万无一失
        $exiftoolPath = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib" -Recurse -Filter "exiftool(-k).exe" | Select-Object -First 1
        
        if ($exiftoolPath) {
            Write-Host "Found ExifTool at: $($exiftoolPath.FullName)"
            # 复制并重命名为 exiftool.exe 到当前工作目录
            Copy-Item $exiftoolPath.FullName -Destination ".\exiftool.exe"
            Write-Host "ExifTool ready."
        } else {
            Write-Error "Could not locate exiftool(-k).exe after Chocolatey install."
            exit 1
        }

    # 3. 打包 EXE
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --clean --onefile --console --name "PolaFlow_Global_Hacker_v24" --add-data "ffmpeg.exe;." --add-data "exiftool.exe;." main.py

    # 4. 上传
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PolaFlow_Tool_v24
        path: dist/PolaFlow_Global_Hacker_v24.exe
